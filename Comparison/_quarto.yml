project:
  type: website
  output-dir: _site
  # Only the site pages are rendered; README.md and analysis notes stay as they are.
  render:
    - index.qmd
    - compare.qmd
    - use.qmd
    - downloads.qmd
    - sources.qmd
    - contribute.qmd
    - report/methods.qmd

website:
  title: "Carbon State of Data"
  site-url: "https://cathald.github.io/Carbon_Data_SOD/"
  repo-url: "https://github.com/CathalD/Carbon_Data_SOD"
  repo-subdir: "Comparison"
  # Source lives on the comparison-analysis branch until PR #1 is merged; switch to main then
  # (and repo_branch in report/_setup.R).
  repo-branch: comparison-analysis
  repo-actions: [source, issue]
  page-navigation: false
  navbar:
    left:
      - href: index.qmd
        text: Data and summaries
      - href: compare.qmd
        text: Comparisons
      - href: use.qmd
        text: How to use
    right:
      - text: More
        menu:
          - href: report/methods.qmd
            text: Methods
          - href: downloads.qmd
            text: Downloads
          - href: sources.qmd
            text: Sources
          - href: contribute.qmd
            text: Contribute
      - icon: github
        href: https://github.com/CathalD/Carbon_Data_SOD
        aria-label: GitHub repository
  page-footer:
    left: "Carbon State of Data for Canada. No map is treated as truth; agreement is not accuracy."
    right: "Built with Quarto from [Comparison/](https://github.com/CathalD/Carbon_Data_SOD/tree/comparison-analysis/Comparison)"

format:
  html:
    theme: [cosmo, assets/styles.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    fig-dpi: 144
    fig-format: png
    code-tools: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  echo: false
  warning: false
  message: false
  freeze: false

lang: en-CA
